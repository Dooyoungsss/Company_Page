# Netlify 배포 설정 — 알고야 홈페이지
# 정적 사이트이므로 빌드 명령 없이 저장소 루트를 그대로 배포합니다.

[build]
  publish = "."

# 모든 응답에 적용되는 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 정적 자산은 장기 캐시 (파일명 변경 시 자동 갱신)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML은 항상 최신 버전 확인
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 존재하지 않는 경로는 404 페이지로 응답
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
